<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A5FA8"/>
      <stop offset="100%" style="stop-color:#0F2D52"/>
    </linearGradient>
    <clipPath id="circle18">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#bg18)"/>

  <!-- Decorative ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="white" stroke-width="1" opacity="0.15"/>

  <g clip-path="url(#circle18)">
    <!-- Clothing / shoulders -->
    
        <rect x="55" y="168" width="90" height="32" rx="0" fill="#1A5FA8"/>
        <polygon points="100,168 85,200 100,185 115,200" fill="white" opacity="0.9"/>
        <polygon points="88,168 78,200 100,185" fill="#0F2D52"/>
        <polygon points="112,168 122,200 100,185" fill="#0F2D52"/>
        

    <!-- Neck -->
    <rect x="88" y="148" width="24" height="26" rx="8" fill="#F4C2A1"/>

    <!-- Hair (behind face) -->
    
            <ellipse cx="100" cy="85" rx="36" ry="32" fill="#2C1810"/>
            <circle cx="72" cy="78" r="12" fill="#2C1810"/>
            <circle cx="84" cy="68" r="12" fill="#2C1810"/>
            <circle cx="100" cy="65" r="13" fill="#2C1810"/>
            <circle cx="116" cy="68" r="12" fill="#2C1810"/>
            <circle cx="128" cy="78" r="12" fill="#2C1810"/>
            

    <!-- Face -->
    <ellipse cx="100" cy="112" rx="30" ry="34" fill="#F4C2A1"/>

    <!-- Eyes -->
    <ellipse cx="89" cy="105" rx="4" ry="4.5" fill="#2C1810"/>
    <ellipse cx="111" cy="105" rx="4" ry="4.5" fill="#2C1810"/>
    <ellipse cx="90" cy="104" rx="1.5" ry="1.5" fill="white"/>
    <ellipse cx="112" cy="104" rx="1.5" ry="1.5" fill="white"/>

    <!-- Eyebrows -->
    <path d="M83 98 Q89 95 95 97" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M105 97 Q111 95 117 98" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M100 108 Q97 115 100 118 Q103 115 100 108" fill="#F4C2A1" stroke="#2C1810" stroke-width="0.8" opacity="0.4"/>

    <!-- Smile -->
    <path d="M91 124 Q100 130 109 124" stroke="#C0725A" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Glasses (every 3rd person) -->
    <rect x="82" y="101" width="14" height="10" rx="5" fill="none" stroke="#555" stroke-width="1.5"/><rect x="104" y="101" width="14" height="10" rx="5" fill="none" stroke="#555" stroke-width="1.5"/><line x1="96" y1="106" x2="104" y2="106" stroke="#555" stroke-width="1.5"/>
  </g>

  <!-- Name initial ring -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="white" stroke-width="0.5" opacity="0.2"/>
</svg>