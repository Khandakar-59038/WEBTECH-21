<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E65100"/>
      <stop offset="100%" style="stop-color:#BF360C"/>
    </linearGradient>
    <clipPath id="circle16">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#bg16)"/>

  <!-- Decorative ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="white" stroke-width="1" opacity="0.15"/>

  <g clip-path="url(#circle16)">
    <!-- Clothing / shoulders -->
    
        <rect x="55" y="168" width="90" height="32" rx="0" fill="#E65100"/>
        <polygon points="100,168 85,200 100,185 115,200" fill="white" opacity="0.9"/>
        <polygon points="88,168 78,200 100,185" fill="#BF360C"/>
        <polygon points="112,168 122,200 100,185" fill="#BF360C"/>
        

    <!-- Neck -->
    <rect x="88" y="148" width="24" height="26" rx="8" fill="#FDDBB4"/>

    <!-- Hair (behind face) -->
    
            <ellipse cx="100" cy="88" rx="34" ry="30" fill="#3D2314"/>
            <rect x="66" y="75" width="68" height="20" rx="4" fill="#3D2314"/>
            

    <!-- Face -->
    <ellipse cx="100" cy="112" rx="30" ry="34" fill="#FDDBB4"/>

    <!-- Eyes -->
    <ellipse cx="89" cy="105" rx="4" ry="4.5" fill="#2C1810"/>
    <ellipse cx="111" cy="105" rx="4" ry="4.5" fill="#2C1810"/>
    <ellipse cx="90" cy="104" rx="1.5" ry="1.5" fill="white"/>
    <ellipse cx="112" cy="104" rx="1.5" ry="1.5" fill="white"/>

    <!-- Eyebrows -->
    <path d="M83 98 Q89 95 95 97" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M105 97 Q111 95 117 98" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M100 108 Q97 115 100 118 Q103 115 100 108" fill="#FDDBB4" stroke="#3D2314" stroke-width="0.8" opacity="0.4"/>

    <!-- Smile -->
    <path d="M91 124 Q100 130 109 124" stroke="#C0725A" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Glasses (every 3rd person) -->
    
  </g>

  <!-- Name initial ring -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="white" stroke-width="0.5" opacity="0.2"/>
</svg>